<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenshinCoach — ton coach Genshin</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top">
  <div>
    <h1>GenshinCoach</h1>
    <p class="sub">Conseils builds, teams et progression à partir de ta vitrine Enka.</p>
  </div>
  <div class="uidbox">
    <label for="uid">UID (EU)</label>
    <input id="uid" inputmode="numeric" value="702342940">
    <button id="refresh" type="button">Actualiser</button>
  </div>
</header>
<main>
  <section class="panel" id="showcase-panel">
    <h2>Vitrine</h2>
    <div id="player" class="muted">Chargement…</div>
    <ul id="chars"></ul>
    <h3>Priorités</h3>
    <ul id="prio"></ul>
    <p id="nodetail" class="warn" hidden>Active « Afficher les détails des personnages » en jeu (crayon du profil) pour un audit complet.</p>
  </section>
  <section class="panel">
    <h2>Coach</h2>
    <div id="chat"></div>
    <form id="form">
      <input id="q" autocomplete="off" placeholder="Ex : que monter en prio cette semaine ? Pourquoi je galère en donjon ?">
      <button type="submit">Envoyer</button>
    </form>
    <div class="row">
      <button id="newchat" type="button" class="ghost">Nouvelle discussion</button>
      <span id="model" class="muted"></span>
    </div>
  </section>
  <section class="panel">
    <h2>News patch</h2>
    <form id="newsform">
      <input id="nq" value="patch notes version actuelle">
      <button type="submit">Chercher</button>
    </form>
    <ul id="news"></ul>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
