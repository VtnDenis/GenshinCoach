services:
  - type: web
    name: genshincoach-api
    runtime: python
    region: frankfurt
    plan: free
    branch: master
    buildCommand: "cd web && npm ci --no-audit --no-fund && npm run build"
    startCommand: python api/server.py
    healthCheckPath: /api/health
    envVars:
      - key: OMNIROUTE_BASE_URL
        value: https://opencode.ai/zen/go/v1
      - key: OMNIROUTE_MODEL
        value: opencode-go/muse-spark-1.3-contributor
      - key: GENSHIN_DEFAULT_UID
        value: "702342940"
      - key: GENSHIN_REGION
        value: EU
      - key: PYTHON_VERSION
        value: 3.14.3
